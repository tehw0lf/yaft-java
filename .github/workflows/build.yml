name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_publish:
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      id-token: write
      attestations: write
      actions: write
      contents: write
      packages: write
      security-events: write
      # security-scan-source calls npm-audit-autofix, which requests it; a
      # missing scope is a startup_failure before any job runs.
      pull-requests: write
    with:
      tool: ./gradlew
      java_version: "25"
      # test fetches the conformance suite pinned in conformance.lock first.
      test: check
      # assemble builds the javadoc jar too, so a doclint error fails here.
      build_branch: assemble
      build_main: assemble
      # Maven Central, via publish-maven-central.yml. Dry run first: signs
      # with the real key and publishes to Maven Local only. Set to false to
      # upload.
      publish_maven_central: true
      maven_central_dry_run: true
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
