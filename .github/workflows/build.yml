name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_publish:
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      id-token: write
      attestations: write
      actions: write
      contents: write
      packages: write
      security-events: write
    with:
      tool: ./gradlew
      java_version: "25"
      # test fetches the conformance suite pinned in conformance.lock first.
      test: check
      # assemble builds the javadoc jar too, so a doclint error fails here.
      build_branch: assemble
      build_main: assemble
